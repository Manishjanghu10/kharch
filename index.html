<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Kharch</title>
<meta name="theme-color" content="#0f1512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kharch">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <div>
      <h1>Kharch</h1>
      <div class="who">Hi, <b id="userName">...</b></div>
    </div>
    <button class="btn-secondary" id="logoutBtn">Log out</button>
  </div>

  <div class="card">
    <h2>Add an expense</h2>
    <div class="mic-row">
      <button class="mic-btn" id="micBtn" title="Dictate">🎤</button>
      <input type="text" id="dictateText" placeholder="e.g. 500 rupees on groceries by UPI">
    </div>
    <div class="mic-hint" id="micHint">Tap the mic and say it, or type it, then tap Parse.</div>
    <button class="btn-secondary" id="parseBtn" style="width:100%; margin-top:12px;">Parse</button>

    <div id="confirmBlock" style="display:none;">
      <div class="parse-grid">
        <div>
          <label>Amount (₹)</label>
          <input type="number" id="fAmount" step="0.01" min="0">
        </div>
        <div>
          <label>Date</label>
          <input type="date" id="fDate">
        </div>
        <div>
          <label>Category</label>
          <select id="fCategory"></select>
        </div>
        <div>
          <label>Payment mode</label>
          <select id="fPaymentMode"></select>
        </div>
        <div class="full">
          <label>Note (optional)</label>
          <input type="text" id="fNote" placeholder="Any extra detail">
        </div>
      </div>
      <button class="btn-primary" id="saveBtn">Save expense</button>
      <button class="btn-secondary" id="cancelBtn" style="width:100%; margin-top:8px;">Cancel</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabDay">Day view</button>
    <button class="tab-btn" id="tabMonth">Month view</button>
  </div>

  <div id="dayPanel">
    <div class="date-nav">
      <button id="dayPrev">‹</button>
      <input type="date" id="dayPicker">
      <button id="dayNext">›</button>
    </div>
    <div class="total-banner">
      <div>
        <div class="label">Total spent</div>
        <div class="value" id="dayTotal">₹0</div>
      </div>
    </div>
    <div class="card" id="dayList"></div>
  </div>

  <div id="monthPanel" style="display:none;">
    <div class="date-nav">
      <button id="monthPrev">‹</button>
      <input type="month" id="monthPicker">
      <button id="monthNext">›</button>
    </div>
    <div class="total-banner">
      <div>
        <div class="label">Total this month</div>
        <div class="value" id="monthTotal">₹0</div>
      </div>
    </div>
    <div class="card">
      <h2>By day</h2>
      <div id="monthDaily"></div>
    </div>
    <div class="card">
      <h2>By category</h2>
      <div id="monthCategory"></div>
    </div>
    <div class="card">
      <h2>By payment mode</h2>
      <div id="monthPaymentMode"></div>
    </div>
  </div>

  <p class="footnote">All data lives only in this browser on this device. <a href="#" id="exportLink">Export as JSON</a> to back it up or move it to a server later.</p>
</div>

<div class="toast" id="toast"></div>

<script src="js/crypto.js"></script>
<script src="js/dataStore.js"></script>
<script src="js/parser.js"></script>
<script src="js/app.js"></script>
</body>
</html>
