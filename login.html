<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Log in - Kharch</title>
<meta name="theme-color" content="#0f1512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kharch">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-wrap" id="fullForm" style="display:none;">
  <h1>Welcome back</h1>
  <p class="sub">Log in to see your spends on this device.</p>
  <div class="card">
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="email" placeholder="you@example.com">

    <label for="password">Password</label>
    <div class="pw-wrap">
      <input type="password" id="password" autocomplete="current-password" placeholder="Your password">
      <button type="button" class="pw-toggle" data-target="password" aria-label="Show password">
        <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-closed" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>

    <button class="btn-primary" id="loginBtn">Log in</button>
    <div class="error" id="error"></div>
  </div>
  <p class="sub" style="text-align:center"><a class="btn-link" href="reset.html">Forgot password?</a></p>
  <p class="sub" style="text-align:center">New on this device? <a class="btn-link" href="signup.html">Create an account</a></p>
</div>

<div class="auth-wrap" id="quickUnlock" style="display:none;">
  <h1>Hi, <span id="quickName"></span></h1>
  <p class="sub">Unlock Kharch on this device.</p>
  <div class="card" id="webauthnCard" style="display:none; text-align:center;">
    <button class="btn-primary" id="webauthnBtn">Unlock with Face ID / Fingerprint</button>
  </div>
  <div class="card" id="pinCard" style="display:none;">
    <p class="sub" style="text-align:center; margin-top:0;">Enter your PIN</p>
    <div class="pin-dots" id="pinDots"></div>
    <div class="error" id="pinError" style="text-align:center;"></div>
    <div class="pin-keypad" id="pinKeypad"></div>
  </div>
  <p class="sub" style="text-align:center"><a class="btn-link" href="#" id="usePasswordLink">Use password instead</a></p>
  <p class="sub" style="text-align:center"><a class="btn-link" href="#" id="switchAccountLink">Not you? Use a different account</a></p>
</div>

<script src="js/crypto.js"></script>
<script src="js/dataStore.js"></script>
<script src="js/webauthn.js"></script>
<script src="js/pwToggle.js"></script>
<script src="js/pinPad.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const errorEl = $('error');

async function doLogin() {
  errorEl.textContent = '';
  $('loginBtn').disabled = true;
  try {
    const result = await DataStore.login({ email: $('email').value, password: $('password').value });
    if (!result.ok) throw new Error(result.error);
    window.location.href = 'index.html';
  } catch (e) {
    errorEl.textContent = e.message;
    $('loginBtn').disabled = false;
  }
}

$('loginBtn').addEventListener('click', doLogin);
$('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

function showFullForm(prefillEmail) {
  $('quickUnlock').style.display = 'none';
  $('fullForm').style.display = 'block';
  if (prefillEmail) $('email').value = prefillEmail;
}

async function showQuickUnlock(info) {
  $('fullForm').style.display = 'none';
  $('quickUnlock').style.display = 'block';
  $('quickName').textContent = info.name;

  if (info.hasWebauthn && await Webauthn.isAvailable()) {
    $('webauthnCard').style.display = 'block';
    $('webauthnBtn').addEventListener('click', async () => {
      try {
        const ok = await Webauthn.authenticate(info.webauthnCredentialId);
        if (!ok) throw new Error();
        DataStore.quickUnlockWithWebauthn(info.email);
        window.location.href = 'index.html';
      } catch (e) {
        $('pinError').textContent = 'Biometric unlock failed or was cancelled -- try your PIN.';
      }
    });
  }

  if (info.hasPin) {
    $('pinCard').style.display = 'block';
    PinPad.buildPinPad($('pinKeypad'), $('pinDots'), 4, async (pin) => {
      const result = await DataStore.quickUnlockWithPin({ email: info.email, pin });
      if (!result.ok) {
        $('pinError').textContent = result.error;
        return;
      }
      window.location.href = 'index.html';
    });
  }
}

$('usePasswordLink').addEventListener('click', (e) => {
  e.preventDefault();
  showFullForm(DataStore.lastEmail());
});
$('switchAccountLink').addEventListener('click', (e) => {
  e.preventDefault();
  showFullForm();
});

(async function init() {
  const last = DataStore.lastEmail();
  if (last) {
    const info = await DataStore.quickUnlockInfo(last);
    if (info && (info.hasPin || info.hasWebauthn)) {
      showQuickUnlock(info);
      if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
      return;
    }
  }
  showFullForm(last);
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
})();
</script>
</body>
</html>
