<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Reset password - Kharch</title>
<meta name="theme-color" content="#0f1512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kharch">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-wrap" id="formScreen">
  <h1>Reset your password</h1>
  <p class="sub">There's no email here -- enter the recovery key you saved when you signed up on this device.</p>
  <div class="card">
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="email" placeholder="you@example.com">

    <label for="recoveryCode">Recovery key</label>
    <input type="text" id="recoveryCode" autocomplete="off" placeholder="ABCD-EFGH-JKMN-PQRS" style="text-transform:uppercase;">

    <label for="newPassword">New password</label>
    <div class="pw-wrap">
      <input type="password" id="newPassword" autocomplete="new-password" placeholder="At least 8 characters">
      <button type="button" class="pw-toggle" data-target="newPassword" aria-label="Show password">
        <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-closed" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>

    <button class="btn-primary" id="resetBtn">Reset password</button>
    <div class="error" id="error"></div>
  </div>
  <p class="sub" style="text-align:center"><a class="btn-link" href="login.html">Back to log in</a></p>
</div>

<div class="auth-wrap" id="recoveryScreen" style="display:none;">
  <h1>Password reset</h1>
  <p class="sub">Your old recovery key is now used up. Here's your new one -- save it somewhere safe.</p>
  <div class="recovery-box">
    <div class="code" id="newRecoveryCode"></div>
  </div>
  <button class="btn-primary" id="continueBtn">Continue to Kharch</button>
</div>

<script src="js/crypto.js"></script>
<script src="js/dataStore.js"></script>
<script src="js/pwToggle.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const errorEl = $('error');

$('resetBtn').addEventListener('click', async () => {
  errorEl.textContent = '';
  $('resetBtn').disabled = true;
  try {
    const result = await DataStore.resetPassword({
      email: $('email').value,
      recoveryCode: $('recoveryCode').value,
      newPassword: $('newPassword').value,
    });
    if (!result.ok) throw new Error(result.error);
    $('formScreen').style.display = 'none';
    $('newRecoveryCode').textContent = result.recoveryCode;
    $('recoveryScreen').style.display = 'block';
  } catch (e) {
    errorEl.textContent = e.message;
    $('resetBtn').disabled = false;
  }
});

$('continueBtn').addEventListener('click', () => { window.location.href = 'index.html'; });

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
